name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "docs/**"
      - "src/**" # OpenAPI generation depends on source files
      - "scripts/**" # Build scripts
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-docs-production.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# Both branches push to gh-pages, so deploys queue instead of cancelling each other.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Needed for proper git history
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Pick the deploy target
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=next" >> "$GITHUB_OUTPUT"
            echo "NEXT_PUBLIC_DOCS_BASE_PATH=/Pulsarr/next" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_DOCS_PREVIEW=true" >> "$GITHUB_ENV"
          fi

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Generate OpenAPI spec
        run: bun run openapi:generate

      - name: Check docs shared files
        run: bun run docs:sync --check

      - name: Cache docs Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: docs/.next/cache
          key: docs-next-${{ runner.os }}-${{ hashFiles('docs/package-lock.json') }}-${{ hashFiles('docs/app/**', 'docs/components/**', 'docs/lib/**', 'docs/content/**', 'docs/styles/**', 'docs/*.ts') }}
          restore-keys: |
            docs-next-${{ runner.os }}-${{ hashFiles('docs/package-lock.json') }}-

      - name: Build documentation
        run: npm --prefix docs run build

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DIR: ${{ steps.target.outputs.dir }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          if [ "$TARGET_DIR" = "." ]; then
            rsync -a --delete --exclude .git --exclude next/ docs/out/ gh-pages/
          else
            mkdir -p "gh-pages/$TARGET_DIR"
            rsync -a --delete docs/out/ "gh-pages/$TARGET_DIR/"
          fi
          cd gh-pages
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy website from ${GITHUB_REF_NAME} at ${GITHUB_SHA}"
            git push
          fi
