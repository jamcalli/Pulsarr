name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'src/**'  # OpenAPI generation depends on source files
      - 'scripts/**'  # Build scripts
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-docs-production.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Needed for proper git history
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Generate OpenAPI spec
        run: bun run openapi:generate

      - name: Check docs shared files
        run: bun run docs:sync --check

      - name: Build documentation
        run: npm --prefix docs run build

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          rsync -a --delete --exclude .git docs/out/ gh-pages/
          cd gh-pages
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy website - based on ${GITHUB_SHA}"
            git push
          fi
