name: Build and Test
on:
  push:
    branches: [ master, develop, feat/ui-rewrite ]
  pull_request:
    branches: [ master, develop, feat/ui-rewrite ]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Vitest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            vitest-${{ runner.os }}-
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Biome
        run: biome ci .
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm ci --prefix docs
      - name: Docs Shared Files Check
        run: bun run docs:sync --check
      - name: TypeScript Check
        run: bun run typecheck
      - name: OpenAPI Contract Drift Check
        run: |
          bun run openapi:dev
          git diff --exit-code docs/public/openapi.json src/client/types/api.d.ts || {
            echo "OpenAPI spec or generated client types are stale. Run 'bun run openapi:dev' and commit the results."
            exit 1
          }
      - name: Run Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Cache docs Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: docs/.next/cache
          key: docs-next-${{ runner.os }}-${{ hashFiles('docs/package-lock.json') }}-${{ hashFiles('docs/app/**', 'docs/components/**', 'docs/lib/**', 'docs/content/**', 'docs/styles/**', 'docs/*.ts') }}
          restore-keys: |
            docs-next-${{ runner.os }}-${{ hashFiles('docs/package-lock.json') }}-
      - name: Build docs
        run: npm --prefix docs run build
