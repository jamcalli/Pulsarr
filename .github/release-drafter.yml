name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🔄 Dependencies'
    exclusive: true
    when:
      labels:
        - 'dependencies'
        - 'deps'
  - title: '🚀 Features'
    exclusive: true
    semver-increment: minor
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: '🐛 Bug Fixes'
    exclusive: true
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
  - title: '⚡ Performance'
    exclusive: true
    when:
      labels:
        - 'performance'
        - 'optimization'
  - title: '🧰 Maintenance'
    exclusive: true
    when:
      labels:
        - 'chore'
        - 'maintenance'
        - 'documentation'
  - type: version-resolver
    semver-increment: major
    when:
      labels:
        - 'major'
        - 'breaking'
  - type: version-resolver
    semver-increment: minor
    when:
      label: 'minor'
  - type: version-resolver
    semver-increment: patch

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(ure)?(\(.+\))?[:/]/i'
    branch:
      - '/^feat(ure)?\//'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?[:/]/i'
    branch:
      - '/^fix\//'
  - label: 'chore'
    title:
      - '/^chore(?!\(deps?\))(\(.+\))?[:/]/i'
      - '/^refactor(\(.+\))?[:/]/i'
      - '/^ci(\(.+\))?[:/]/i'
    branch:
      - '/^chore\//'
      - '/^refactor\//'
      - '/^ci\//'
  - label: 'documentation'
    title:
      - '/^docs?(\(.+\))?[:/]/i'
    branch:
      - '/^docs?\//'
  - label: 'performance'
    title:
      - '/^perf(ormance)?(\(.+\))?[:/]/i'
    branch:
      - '/^perf(ormance)?\//'
  - label: 'dependencies'
    title:
      - '/^chore\(deps\)/i'
      - '/^fix\(deps\)/i'
    branch:
      - '/^renovate\//'

template: |
  ## Changes

  $CHANGES

  ## Docker
  ```
  docker pull lakker/pulsarr:$RESOLVED_VERSION
  ```

  **Synology NAS / Legacy Systems** (Linux kernel < 4.11):
  ```
  docker pull lakker/pulsarr:$RESOLVED_VERSION-node
  ```

  ## Contributors

  $CONTRIBUTORS
